# LLM Configuration

# Model settings
llm:
  # Available options: 'openai', 'anthropic', 'huggingface', 'local'
  provider: 'llama_server'
  
  # Model names
  openai:
    model: 'gpt-4o-mini'  # or 'gpt-4o', 'gpt-4-turbo'
    api_key_env: 'OPENAI_API_KEY'
    temperature: 0.7
    max_tokens: 2000
    
  anthropic:
    model: 'claude-3-5-sonnet-20241022'
    api_key_env: 'ANTHROPIC_API_KEY'
    temperature: 0.7
    max_tokens: 2000
    
  huggingface:
    model: 'meta-llama/Llama-3.1-70B-Instruct'
    api_key_env: 'HF_API_KEY'
    temperature: 0.7
    max_tokens: 2000
    
  local:
    model_path: '/path/to/local/model'
    device: 'cuda'
    temperature: 0.7
    max_tokens: 2000
  
  # Llama local model (direct loading)
  llama:
    model_path: '/u/xfeng4/.cache/modelscope/hub/models/LLM-Research/Meta-Llama-3.1-8B-Instruct'
    device: 'auto'
    dtype: 'bfloat16'  # or 'float16', 'float32'
    temperature: 0.7
    max_tokens: 2000
  
  # Llama server (via HTTP API - more efficient for batch processing)
  llama_server:
    server_url: 'http://localhost:8000'
    temperature: 0.7
    max_tokens: 2000

# Experiment settings
experiment:
  # Random seed for reproducibility
  seed: 42
  
  # Batch processing
  batch_size: 10
  
  # Cache settings
  use_cache: true
  cache_dir: './llm_experiments/cache'
  
  # Logging
  log_level: 'INFO'
  log_file: './llm_experiments/logs/experiment.log'

# Cost control
cost_control:
  # Maximum number of API calls per experiment
  max_api_calls: 1000
  
  # Use cheaper models for pilot experiments
  pilot_mode: true
  pilot_model: 'gpt-4o-mini'
  
  # Sample size for pilot experiments
  pilot_sample_size: 100





